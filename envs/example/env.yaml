# 示例环境:虚构的两个托管集群(alpha / beta)与几类零散资源,供开箱体验与核心测试使用。
# 真实环境另建私有环境包,在 <数据根>/config/paths.local.yaml 写 env_pack 指过去。路径一律相对本目录。
# 地址只用文档地址段(192.0.2.0/24、198.51.100.0/24、203.0.113.0/24),域名只用 example.internal。
version: 1
id: example
display_name: 示例环境
timezone: UTC
requires_core: ">=1.0,<2"
python: python                  # Python 扩展目录(example_ext);核心按下面的扩展点加载
extensions:
  credential_profiles: example_ext.profiles:profiles   # 账号页凭据项:每个托管集群一个管理面账号
  alert_sources: {demo: example_ext.demo_alerts:create_source}   # 演示告警源,按集群各一个
  graphs:                       # 演示图谱:固定的小作业调度图,知识页与分组库组装都读它
    - {id: jobs, title: 作业调度, collector: example_ext.demo_graph:collect}
clusters:                       # 顺序即各处平台列表顺序
  - id: alpha
    display_name: Alpha 集群
    short_name: Alpha
    roles: [managed, knowledge]
    sources:
      hosts: config/platform-alpha.yaml
      topology: config/topology/snapshot-alpha.json
  - id: beta                    # 节点名与 alpha 重名(node1~3),用来覆盖跨集群同名场景
    display_name: Beta 集群
    short_name: Beta
    roles: [managed, knowledge]
    sources:
      hosts: config/platform-beta.yaml
      topology: config/topology/snapshot-beta.json
  - id: db                      # 独立数据库集群:只经 MySQL 插件,不走集群 SSH 诊断
    display_name: 数据库集群
    short_name: DB
    roles: [mysql_direct, knowledge]
    sources:
      hosts: config/topology-db.yaml
  - id: misc                    # 零散节点;旧短键 shared 与知识库「环境级」键同名,知识库另用 misc
    legacy_key: shared
    knowledge_key: misc
    display_name: 零散节点
    roles: [mysql_direct, knowledge]
    sources:
      hosts: config/topology-misc.yaml
  - id: cache
    display_name: 缓存集群
    short_name: Cache
    roles: [knowledge]
    sources:
      hosts: config/topology-cache.yaml
  - id: edge
    display_name: 边缘节点
    roles: [knowledge]
    sources:
      hosts: config/topology-edge.yaml
inventory:
  manual_dependencies: config/topology/manual-dependencies.yaml
knowledge:                      # 知识库封闭词表:frontmatter 的 service / task_type 只能取这里
  services: [
    yarn, hdfs, hive, hbase, spark, kafka, system, zookeeper, mysql, namenode, datanode,
    resourcemanager, nodemanager, journalnode, zkfc, regionserver, hbasemaster, hiveserver2,
    metastore, network, topology, nginx, mapreduce, clickhouse, prometheus, redis, jobs,
    emqx, elasticsearch, flink, hue, impala, kudu, oozie, solr, storm, nfs, moosefs,
  ]
  task_types: [SQL, SPARKSQL, HIVE, SHELL, TRANSFER, MYSQL, SQLSERVER, DEP]
  service_labels: {
    clickhouse: ClickHouse, datanode: DataNode, elasticsearch: Elasticsearch, emqx: EMQX, flink: Flink,
    hue: Hue, impala: Impala, kudu: Kudu, moosefs: MooseFS, nfs: NFS, oozie: Oozie, solr: Solr, storm: Storm, hbase: HBase, hbasemaster: "HBase Master",
    hdfs: HDFS, hive: Hive, hiveserver2: HiveServer2, jobs: "作业调度", journalnode: JournalNode,
    kafka: Kafka, mapreduce: MapReduce, metastore: Metastore, mysql: MySQL, namenode: NameNode,
    nginx: Nginx, nodemanager: NodeManager, prometheus: Prometheus, redis: Redis,
    regionserver: RegionServer, resourcemanager: ResourceManager, spark: Spark, system: "系统",
    topology: "拓扑", yarn: YARN, zkfc: ZKFC, zookeeper: ZooKeeper,
  }
  service_aliases:
    jobs: [job scheduler, jobscheduler, 作业调度]
  assembly:                     # 分组库确定性组装示例:作业调度库按图谱里的流程/任务号识别任务类型
    library: jobs
    graph: jobs
    label: 作业调度
    service: jobs
    refresh_hint: "刷新:scripts/collect_graph.py --graph jobs --mode full"
    home_services: [jobs]
    runtime_services: [hdfs, hive, mapreduce, mysql, spark, system, yarn]
    runtime_weight: 0.6
    other_weight: 0.3
plugins:                        # 官方插件示例(地址均为本机占位,插件页可覆盖);本机开关与凭据在中台插件页配置
  - id: manager-alpha           # 集群管理面插件:按集群各一个,带两阶段写
    title: Alpha 集群管理
    url: http://127.0.0.1:30161/mcp
    cluster: alpha
    auth: basic
    default_disabled: [plan_operation]   # 写操作需在插件页显式启用,并先配审批密钥
    write: &manager_write       # 两阶段写:模型只见 plan;execute 仅 Harness 在人工批准后调用
      plan: plan_operation
      execute: execute_operation
      track: get_operation
      reconcile: list_operations
      impact: get_topology
  - id: manager-beta
    title: Beta 集群管理
    url: http://127.0.0.1:30162/mcp
    cluster: beta
    auth: basic
    default_disabled: [plan_operation]
    write: *manager_write
  - id: mysql
    title: MySQL
    url: http://127.0.0.1:30164/mcp
    auth: connections           # 连接由插件页逐条填写(中台持有),序列化进请求头传给插件
    header_name: X-Ops-MySQL-Connections
    connection_probe: list_connections
    scope:                      # 每条连接带所属集群标签;任务里自动限定到本集群
      label: platform
      clusters: {alpha: alpha, beta: beta, db: db, shared: shared}
      tools: [list_connections, get_instance_identity, get_replica_status, list_sessions, list_long_transactions,
              list_lock_waits, get_global_status, get_global_variables]
  - id: prometheus
    title: Prometheus
    url: http://127.0.0.1:30163/mcp
    auth: none
    scope:
      label: platform
      clusters: {alpha: alpha, beta: beta}
      tools: [list_targets, list_alerts, list_alert_history, get_resource_snapshot, query_named]
    feeds:
      alerts: {current: list_alerts, history: list_alert_history, rules: list_alert_rules}
      resources: {snapshot: get_resource_snapshot, targets: list_targets, query: query_named}
